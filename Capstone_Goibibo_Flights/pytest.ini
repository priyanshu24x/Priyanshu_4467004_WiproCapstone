[pytest]
# MIX: Generates both Allure data AND a single-page HTML report with log tracking
addopts = -s -v --alluredir="reports/allure-results" --html=reports/html-report.html --self-contained-html

# FROM THEIR CODE: Custom execution categories
markers =
    smoke: marks operational smoke tests
    regression: marks complete validation regression suites
    negative: marks boundary and error-handling verification runs

# FROM THEIR CODE: Formats terminal stream logs cleanly during execution
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %H:%M:%S